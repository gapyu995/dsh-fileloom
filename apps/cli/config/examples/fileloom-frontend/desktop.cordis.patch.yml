# Build plugins/fileloom before applying this source-development overlay.
# Disable the fork's duplicate entries before mounting the unified package.
- id: file-manager
  disabled: true
- id: ui-file-manager
  disabled: true
- insert:
    - id: fileloom
      name: '../../../../../plugins/fileloom/lib/index.js'
      config:
        roots: []
        maxScanFiles: 20000
        planTtlHours: 24
