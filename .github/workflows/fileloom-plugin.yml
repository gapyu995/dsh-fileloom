name: Fileloom Plugin
on:
  push:
    branches: ['main']
    tags: ['fileloom-plugin-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run pack:release
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: fileloom-plugin
          path: .artifacts/release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/fileloom-plugin-v')
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fileloom-plugin
          path: release
      - name: Publish Prebuilt Plugin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag --title "Fileloom DSH Plugin ${GITHUB_REF_NAME#fileloom-plugin-}"
          --notes "Fileloom for DSH 0.2.2-rc.1 and Node.js 24.9+. This release adds browser thumbnail caching, persistent media indexes, a music player that survives panel navigation, saved queues, and read-only mounted NAS libraries with local state. All four desktops were checked in light/dark themes at desktop and narrow widths. The prebuilt .tgz has no install scripts. Install it with dsh plugin --profile web add <archive URL>, and verify SHA256SUMS. See README.zh.md for Chinese instructions and the remaining codec, first-download, and physical-NAS validation limits."
